name: backend-ci

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed backend services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          chmod +x scripts/detect_changes.sh
          ./scripts/detect_changes.sh

  build-services:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          if find . -maxdepth 2 -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest -q
          else
            echo "No test files found for ${{ matrix.service }}; skipping pytest."
          fi

      - name: Package Lambda artifact
        shell: bash
        run: |
          chmod +x scripts/package_lambda.sh
          ./scripts/package_lambda.sh "${{ matrix.service }}"

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-lambda-package
          path: ${{ github.workspace }}/${{ matrix.service }}.zip
          if-no-files-found: error
