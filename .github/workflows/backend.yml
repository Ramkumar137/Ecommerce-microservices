name: backend-ci

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed backend services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          chmod +x scripts/detect_changes.sh
          ./scripts/detect_changes.sh

  build-services:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          if find . -maxdepth 2 -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest -q
          else
            echo "No test files found for ${{ matrix.service }}; skipping pytest."
          fi

      - name: Package Lambda artifact
        shell: bash
        run: |
          chmod +x scripts/package_lambda.sh
          ./scripts/package_lambda.sh "${{ matrix.service }}"

      - name: Validate Lambda artifact
        shell: bash
        run: |
          zip_path="${{ github.workspace }}/${{ matrix.service }}.zip"
          if [ ! -f "$zip_path" ]; then
            echo "ERROR: Lambda ZIP package not found at $zip_path" >&2
            exit 1
          fi
          echo "=== Listing ZIP Contents for ${{ matrix.service }}.zip ==="
          unzip -l "$zip_path"

          echo "=== Verifying Lambda Handler & Root Modules ==="
          python - <<'PY' "$zip_path" "${{ matrix.service }}"
          import sys
          import zipfile
          from pathlib import Path

          zip_path = Path(sys.argv[1])
          service_name = sys.argv[2]

          with zipfile.ZipFile(zip_path, 'r') as zipf:
              namelist = zipf.namelist()
              if not namelist:
                  print("ERROR: ZIP archive is empty!", file=sys.stderr)
                  sys.exit(1)
              if "lambda_handler.py" not in namelist:
                  print(f"ERROR: 'lambda_handler.py' NOT found at ZIP root for {service_name}!", file=sys.stderr)
                  sys.exit(1)
              if any(n.startswith(f"{service_name}/") or n.startswith("backend/") for n in namelist):
                  print(f"ERROR: ZIP contains nested parent directory wrapper!", file=sys.stderr)
                  sys.exit(1)
              has_mangum = any(n.startswith("mangum/") or n.startswith("mangum-") for n in namelist)
              has_django = any(n.startswith("django/") or n.startswith("django-") for n in namelist)
              if not (has_mangum and has_django):
                  print("ERROR: ZIP is missing required Python dependencies (mangum/django)!", file=sys.stderr)
                  sys.exit(1)

              print(f"SUCCESS: Lambda ZIP artifact structure validated for {service_name}.")
          PY

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-lambda-package
          path: ${{ github.workspace }}/${{ matrix.service }}.zip
          if-no-files-found: error
